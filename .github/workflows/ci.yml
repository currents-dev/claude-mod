name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Validate the marketplace
        run: claude plugin validate --strict .

      - name: Validate currents-ci
        run: claude plugin validate --strict plugins/currents-ci

      - name: Test currents-ci
        run: claude plugin test plugins/currents-ci
