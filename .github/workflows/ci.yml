name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate currents-ci
        run: claude plugin validate plugins/currents-ci

      - name: Test currents-ci
        run: claude plugin test plugins/currents-ci
